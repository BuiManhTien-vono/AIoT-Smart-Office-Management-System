# =============================================================================
# NGINX API GATEWAY & REVERSE PROXY (SSL HTTPS + DYNAMIC DOCKER DNS RESOLVER)
# Định tuyến tập trung cho Frontend React, Backend .NET 10, SignalR & AI Service
# =============================================================================

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name soms.id.vn www.soms.id.vn _;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name soms.id.vn www.soms.id.vn _;

    ssl_certificate /etc/letsencrypt/live/soms.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/soms.id.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 30M;

    # 1. Giao diện Web Frontend (React + Vite SPA)
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend API .NET 10 (5 Modules: Biometrics, Attendance, Occupancy, Security, Reporting)
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Swagger UI & OpenAPI Spec của Backend .NET 10
    location /swagger {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. SignalR Hubs (WebSockets thời gian thực cho Live Seat Map & Cảnh báo tại /hubs/occupancy)
    location /hubs/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # 5. AI Service FastAPI Docs & Endpoints (Truy cập qua /ai-docs hoặc nội bộ)
    location /ai/ {
        set $ai_service_upstream http://ai_service:8000;
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass $ai_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# =============================================================================
# NGINX API GATEWAY & REVERSE PROXY (BUỔI 8 - MULTI-CONTAINER ARCHITECTURE)
# Định tuyến tập trung cho Frontend React, Backend .NET 10, SignalR & AI Service
# =============================================================================

upstream backend_upstream {
    server backend:8080;
}

upstream frontend_upstream {
    server frontend:80;
}

upstream ai_service_upstream {
    server ai_service:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30M;

    # 1. Giao diện Web Frontend (React + Vite SPA)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend API .NET 10 (5 Modules: Biometrics, Attendance, Occupancy, Security, Reporting)
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Swagger UI & OpenAPI Spec của Backend .NET 10
    location /swagger {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. SignalR Hubs (WebSockets thời gian thực cho Live Seat Map & Cảnh báo tại /hubs/occupancy)
    location /hubs/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }

    # 5. AI Service FastAPI Docs & Endpoints (Truy cập qua /ai-docs hoặc nội bộ)
    location /ai/ {
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://ai_service_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

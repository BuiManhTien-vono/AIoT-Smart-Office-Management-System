server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hỗ trợ React Router (SPA Fallback) - Tránh lỗi 404 khi F5 trên các trang con
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh (JS, CSS, Images, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}

